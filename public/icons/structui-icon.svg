<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D38E9"/>
      <stop offset="100%" stop-color="#1B17A6"/>
    </linearGradient>

    <!-- Top facet lighting -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E69FF"/>
      <stop offset="100%" stop-color="#4C47F5"/>
    </linearGradient>

    <!-- Left facet -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3D38E9"/>
      <stop offset="100%" stop-color="#2622B8"/>
    </linearGradient>

    <!-- Right facet -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2823C4"/>
      <stop offset="100%" stop-color="#181585"/>
    </linearGradient>

    <!-- Neon Accent Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle rounded background box -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Architectural 3D Interlocking 'S' / Structural UI Blocks -->
  <g transform="translate(20, 20)">
    <!-- Top Block (Right Corner Cube) -->
    <path d="M40 8 L64 22 L40 36 L16 22 Z" fill="url(#topFacet)"/>
    <path d="M16 22 L40 36 L40 50 L16 36 Z" fill="url(#leftFacet)"/>
    <path d="M40 36 L64 22 L64 36 L40 50 Z" fill="url(#rightFacet)"/>

    <!-- Bottom Interlocking Block (Left Corner Cube) -->
    <path d="M40 44 L64 58 L40 72 L16 58 Z" fill="url(#topFacet)"/>
    <path d="M16 58 L40 72 L40 78 L16 64 Z" fill="url(#leftFacet)"/>
    <path d="M40 72 L64 58 L64 64 L40 78 Z" fill="url(#rightFacet)"/>

    <!-- Floating Neon Cyan UI Structural Node / Accent -->
    <polygon points="40,24 52,31 40,38 28,31" fill="url(#cyanGlow)" filter="url(#glow)"/>
    <circle cx="40" cy="31" r="3" fill="#FFFFFF"/>
    
    <!-- Lower Node -->
    <polygon points="40,60 52,67 40,74 28,67" fill="url(#cyanGlow)" opacity="0.9"/>
  </g>
</svg>
